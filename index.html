<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HornMarket | Ethiopia Marketplace</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- TOP BAR -->

<div class="top-bar">

🇪🇹 Ethiopia's Digital Marketplace 
| Buy • Sell • Discover

</div>





<!-- HEADER -->

<header class="app-header">


<div class="container header-content">



<!-- LOGO -->

<div class="logo">

<h1>
🛒 HornMarket
</h1>

<p>
Ethiopia Marketplace
</p>

</div>





<!-- SEARCH -->

<div class="search-box">


<input
type="search"
id="search"
placeholder="Search products..."
>


<button id="search-btn">

🔍

</button>


</div>





<!-- CART -->

<button 
class="cart-btn" 
id="open-cart">


🛒

<span id="cart-count">
0
</span>


</button>



</div>


</header>
<!-- MAIN APP -->

<main id="app">





<!-- HOME PAGE -->

<section id="home-page" class="page">





<!-- HERO SECTION -->

<div class="hero">


<div class="hero-content">


<h1>
Everything You Need,
<br>
In One Marketplace
</h1>



<p>
Buy and sell products easily across Ethiopia.
</p>





<div class="hero-buttons">



<button 
class="primary-btn"
data-page="products">

Start Shopping

</button>





<button 
class="secondary-btn"
data-page="sell">

Sell Product

</button>



</div>


</div>


</div>





</section>

   



<!-- MARKETPLACE STATISTICS -->

<section class="stats">



<div class="stat-card">

<h3 id="product-count">
0
</h3>

<p>
Products
</p>

</div>





<div class="stat-card">

<h3 id="seller-count">
0
</h3>

<p>
Sellers
</p>

</div>





<div class="stat-card">

<h3 id="order-count">
0
</h3>

<p>
Orders
</p>

</div>





<div class="stat-card">

<h3>
🇪🇹
</h3>

<p>
Ethiopia
</p>

</div>



</section>







<!-- CATEGORY SECTION -->


<section class="categories">



<h2>
Shop By Category
</h2>




<div class="category-grid">





<button class="category-card category-btn active">

<span>
🛍️
</span>

All

</button>





<button class="category-card category-btn">

<span>
📱
</span>

Electronics

</button>





<button class="category-card category-btn">

<span>
👕
</span>

Fashion

</button>





<button class="category-card category-btn">

<span>
🍔
</span>

Food

</button>





<button class="category-card category-btn">

<span>
🏠
</span>

Home

</button>





<button class="category-card category-btn">

<span>
🚗
</span>

Vehicles

</button>





<button class="category-card category-btn">

<span>
💻
</span>

Computers

</button>





<button class="category-card category-btn">

<span>
📚
</span>

Books

</button>





</div>



</section>

</div>

<header>
</header>


<main id="app">

</div>

</section>
