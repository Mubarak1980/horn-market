<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HornMarket | Ethiopia Marketplace</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =========================
     APP HEADER
========================= -->

<header class="app-header">

<div class="container header-content">


<div class="logo">

<h1>
🛒 HornMarket
</h1>

</div>



<div class="search-box">


<input 
type="search"
id="search"
placeholder="Search products..."
>


<button id="search-btn">

🔍

</button>


</div>



<button class="cart-btn" id="open-cart">

🛒

<span id="cart-count">
0
</span>

</button>


</div>

</header>





<!-- =========================
     MAIN APP
========================= -->

<main id="app">





<!-- HOME -->

<section id="home-page" class="page">


<div class="hero">


<h1>
HornMarket
</h1>


<p>
Your local digital marketplace
</p>


<button class="primary-btn" data-page="products">

Start Shopping

</button>


</div>





<h2>
Featured Products
</h2>


<div 
id="featured-products"
class="products">


</div>



</section>







<!-- PRODUCTS -->

<section 
id="products-page"
class="page hidden">


<h2>
All Products
</h2>





<div class="category-bar">


<button class="category-btn active">

All

</button>



<button class="category-btn">

Electronics

</button>



<button class="category-btn">

Fashion

</button>



<button class="category-btn">

Food

</button>



<button class="category-btn">

Home

</button>



</div>






<div 
id="products-container"
class="products">


</div>



</section>







<!-- SELL -->

<section 
id="sell-page"
class="page hidden">


<h2>
Sell Product
</h2>




<form id="sell-form">



<input

id="product-name"

type="text"

placeholder="Product name"

required

>



<input

id="product-price"

type="number"

placeholder="Price in Birr"

required

>




<input

id="product-category"

type="text"

placeholder="Category"

required

>





<input

id="product-image"

type="url"

placeholder="Product image URL"

>




<textarea

id="product-description"

placeholder="Product description">

</textarea>





<button class="primary-btn">

Publish Product

</button>



</form>



</section>







<!-- ACCOUNT -->

<section 
id="account-page"
class="page hidden">


<h2>
My Account
</h2>



<div class="account-card">


<h3>
Seller Dashboard
</h3>


<p>
Manage products, sales and orders.
</p>


<div class="dashboard">


<div class="dashboard-card">

<h3>
Products
</h3>

<strong id="product-count">
0
</strong>

</div>



<div class="dashboard-card">

<h3>
Orders
</h3>

<strong>
0
</strong>

</div>



<div class="dashboard-card">

<h3>
Sales
</h3>

<strong>
0 Birr
</strong>

</div>



</div>


</div>


</section>





</main>









<!-- =========================
     CART PANEL
========================= -->


<div 
id="cart-panel"
class="cart-panel hidden">



<div class="cart-header">


<h2>
Your Cart
</h2>


<button id="close-cart">

✕

</button>


</div>





<div id="cart-items">


</div>





<div class="cart-summary">


<h3 id="cart-total">

Total: 0 Birr

</h3>



<button class="checkout-btn">

Checkout

</button>


</div>




</div>








<!-- =========================
     MOBILE NAVIGATION
========================= -->


<nav class="bottom-nav">


<button data-page="home">

<span>
🏠
</span>

Home

</button>




<button data-page="products">

<span>
📦
</span>

Products

</button>





<button data-page="sell">

<span>
➕

</span>

Sell

</button>





<button data-page="account">

<span>
👤
</span>

Account

</button>



</nav>







<script src="script.js"></script>


</body>

</html>
